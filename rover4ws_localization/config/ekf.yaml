# Local EKF: wheel odometry + IMU yaw rate -> odom -> base_footprint
# No GPS: the odom frame is the navigation frame for the prototype.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry: body velocities vx, vy, vyaw
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    # IMU: yaw rate only (absolute yaw from a magnetometer is unreliable near motors)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true
